[project]
name = "openspeak"
version = "0.1.0"
description = "Speak freely with an AI partner; get every mistake graded silently and a study report afterwards. Local-first."
readme = "README.md"
license = "MIT"
authors = [{ name = "MGMCN" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Free, offline speech recognition. Downloads a Whisper model on first use.
# av 19 dropped open(metadata_errors=...), which faster-whisper 1.2 still passes: every transcription fails.
local = ["faster-whisper>=1.0", "av<19"]

[project.urls]
Homepage = "https://github.com/ai-mgmcn/openspeak"
Issues = "https://github.com/ai-mgmcn/openspeak/issues"

[project.scripts]
openspeak = "openspeak.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/openspeak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests use the anyio plugin that ships with anyio (a FastAPI dependency).
addopts = "-p anyio --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Errors, pyflakes, bugbear, pyupgrade. Imports aren't sorted on purpose: speech.py
# must import privacy before faster_whisper.
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]  # long lines are fine; the formatter isn't enforced

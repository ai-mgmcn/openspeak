name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false  # one system failing shouldn't hide how the others did
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]  # the oldest supported and the newest
    steps:
      # Actions are pinned to commits; the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Check the page's script parses
        run: node --check src/openspeak/web/static/app.js

  # The page itself, in the Chrome the runner has: moving between conversations, the sidebar, and so on.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run --with playwright pytest tests/browser -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts

  # What a user gets: build the package, install it into a clean environment, start it.
  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - name: Build
        run: uv build --out-dir dist
      - name: Install the wheel in a clean environment
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/clean"
          VIRTUAL_ENV="$RUNNER_TEMP/clean" uv pip install dist/*.whl
          # the new environment's scripts first, so `openspeak` is the one just installed
          echo "$RUNNER_TEMP/clean/bin" >> "$GITHUB_PATH"
      - name: Start it
        run: python scripts/smoke.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: docker build -t openspeak .
      - name: Start it
        run: |
          docker run -d --name os -p 127.0.0.1:8765:8765 openspeak
          for i in $(seq 30); do curl -sf http://localhost:8765/ >/dev/null && exit 0; sleep 1; done
          docker logs os; exit 1
